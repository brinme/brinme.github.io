<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brinme App - Dashboard</title>
    <link rel="icon" href="../images/brinme_favicon.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="js/telegram-integration.js"></script>
    <script type="module" src="js/localization.js"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">


    <div class="flex h-screen overflow-hidden">
        <!-- Desktop Sidebar (Hidden on Mobile) -->
        <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-200">
            <div class="p-6 flex items-center gap-2 border-b border-gray-100">
                <img src="../images/brinme_small_icon.webp" alt="Brinme" class="h-8 w-8 rounded-full">
                <span class="font-bold text-xl text-[#25A8D9]">brinme</span>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <div onclick="window.location.href='index.html'" class="flex items-center gap-3 px-4 py-3 text-[#25A8D9] bg-blue-50 rounded-lg font-medium cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    <span data-i18n="nav_home">Home</span>
                </div>
                <div onclick="window.location.href='rides.html'" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg font-medium transition-colors cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                    <span data-i18n="nav_rides">Rides</span>
                </div>
                <div onclick="window.location.href='profile.html'" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg font-medium transition-colors cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    <span data-i18n="nav_profile">Profile</span>
                </div>
            </nav>
            <div class="p-4 border-t border-gray-100">
                <button id="logoutBtnDesktop" class="flex items-center gap-3 px-4 py-3 text-red-500 hover:bg-red-50 rounded-lg font-medium w-full transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    <span data-i18n="nav_logout">Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col h-screen overflow-hidden">
            <!-- Mobile Header -->
            <header class="md:hidden bg-white shadow-sm p-4 flex justify-between items-center sticky top-0 z-10 brinme-main-mobile-header">
                <div class="flex items-center gap-2">
                    <img src="../images/brinme_small_icon.webp" alt="Brinme" class="h-8 w-8 rounded-full">
                    <span class="font-bold text-xl text-[#25A8D9]">brinme</span>
                </div>
                <button id="logoutBtnMobile" class="text-sm text-gray-600 hover:text-red-500" data-i18n="nav_logout">Logout</button>
            </header>

            <!-- Scrollable Content -->
            <main class="flex-1 overflow-y-auto p-4 pb-24 md:p-8">
                <div class="max-w-4xl mx-auto">
                    <!-- Welcome Section -->
                    <div class="mb-8">
                        <h1 class="text-2xl md:text-3xl font-bold text-gray-800"><span data-i18n="hello">Hello</span>, <span id="userName">User</span>! 👋</h1>
                        <p class="text-gray-600 mt-1" data-i18n="dashboard_subtitle">Do you want to save or earn on delivery today?</p>
                    </div>

                    <!-- Action Buttons (Mobile & Desktop) -->
                    <div class="grid grid-cols-2 md:grid-cols-2 gap-4 mb-8">
                        <div onclick="window.location.href='search-ride.html'" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center gap-3 hover:shadow-md transition-shadow group cursor-pointer">
                            <div class="bg-blue-50 p-4 rounded-full group-hover:bg-blue-100 transition-colors">
                                <svg class="w-8 h-8 text-[#25A8D9]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            </div>
                            <span class="font-bold text-gray-700 text-center" data-i18n="btn_find_ride">Find Ride</span>
                            <span class="text-xs text-gray-500 text-center" data-i18n="desc_find_ride">Search for available space</span>
                        </div>
                        <div onclick="window.location.href='add-ride.html'" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center gap-3 hover:shadow-md transition-shadow group cursor-pointer">
                            <div class="bg-green-50 p-4 rounded-full group-hover:bg-green-100 transition-colors">
                                <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            </div>
                            <span class="font-bold text-gray-700 text-center" data-i18n="btn_offer_ride">Offer Ride</span>
                            <span class="text-xs text-gray-500 text-center" data-i18n="desc_offer_ride">Earn by delivering packages</span>
                        </div>
                    </div>

                    <!-- My Rides Section -->
                    <div>
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-xl font-bold text-gray-800" data-i18n="title_my_next_ride">My Next Ride</h2>
                            <a href="rides.html" class="text-sm text-[#25A8D9] hover:underline" data-i18n="link_view_all">View all</a>
                        </div>
                        <div id="ridesList" class="space-y-3">
                            <!-- Loading State -->
                            <div class="animate-pulse flex space-x-4">
                                <div class="flex-1 space-y-4 py-1">
                                    <div class="h-24 bg-gray-200 rounded-lg"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <!-- Mobile Bottom Navigation -->
            <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-3 flex justify-between items-center z-20">
                <div onclick="window.location.href='index.html'" class="flex flex-col items-center gap-1 text-[#25A8D9] cursor-pointer">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    <span class="text-xs font-medium" data-i18n="nav_home">Home</span>
                </div>
                <div onclick="window.location.href='rides.html'" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-600 cursor-pointer">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                    <span class="text-xs font-medium" data-i18n="nav_rides">Rides</span>
                </div>
                <div onclick="window.location.href='profile.html'" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-600 cursor-pointer">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    <span class="text-xs font-medium" data-i18n="nav_profile">Profile</span>
                </div>
            </nav>
        </div>
    </div>

    <script type="module">
        import { auth, db, functions } from './js/firebase-config.js';
        import { onAuthStateChanged, signOut, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc, setDoc, updateDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js";
        import { LocalizationManager } from './js/localization.js';
        import { showToast } from './js/toast.js';
        import { createUser } from './js/models.js';

        // Initialize Localization
        const localization = new LocalizationManager();
        await localization.init();

        const userNameElement = document.getElementById('userName');
        const logoutBtnMobile = document.getElementById('logoutBtnMobile');
        const logoutBtnDesktop = document.getElementById('logoutBtnDesktop');
        const ridesList = document.getElementById('ridesList');

        // Helper: Format Date
        const formatDate = (dateString) => {
            if (!dateString) return localization.getText('text_unknown_date') || "Unknown Date";
            const date = new Date(dateString);
            const day = date.getDate();
            const month = date.toLocaleString(localization.currentLang, { month: 'short' });
            const year = date.getFullYear();
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            
            return `${month} ${day}, ${year}. ${hours}:${minutes}`;
        };

        // Telegram Login Logic
        let isLoggingIn = false;
        const loginWithTelegram = async () => {
            if (isLoggingIn) return;
            
            const tg = window.Telegram.WebApp;
            if (!tg.initData) {
                return;
            }

            isLoggingIn = true;
            
            try {
                const authTelegramFn = httpsCallable(functions, 'authTelegram');
                const result = await authTelegramFn({ initData: tg.initData });
                const token = result.data.token;
                
                await signInWithCustomToken(auth, token);
            } catch (error) {
                showToast('error_login', 'error');
            } finally {
                isLoggingIn = false;
            }
        };

        // Check Auth State
        onAuthStateChanged(auth, async (user) => {
            // 1. Robust Telegram Detection
            let isTelegram = window.isTelegramApp;
            
            // Fallback: Check User Agent if global var is not set yet
            if (typeof isTelegram === 'undefined') {
                if (navigator.userAgent.includes('Telegram') || navigator.userAgent.includes('TME')) {
                    isTelegram = true;
                }
            }

            if (isTelegram) {
                // Wait for SDK if needed
                if (!window.Telegram || !window.Telegram.WebApp) {
                    let attempts = 0;
                    while ((!window.Telegram || !window.Telegram.WebApp) && attempts < 30) {
                        await new Promise(r => setTimeout(r, 100));
                        attempts++;
                    }
                }

                const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
                
                if (!user) {
                    // Not logged in -> Login via Telegram
                    await loginWithTelegram();
                    return;
                }

                // User is logged in. Verify it matches the current Telegram user.
                if (tgUser) {
                    // Check if the current Firebase User UID matches the expected Telegram UID
                    // The Cloud Function sets UID as `tg_${telegram_id}`
                    const expectedUid = `tg_${tgUser.id}`;
                    
                    if (user.uid !== expectedUid) {
                        await signOut(auth);
                        await loginWithTelegram();
                        return;
                    }
                }
            }

            // 2. Handle Logged In User
            if (user) {
                // Browser Users: Enforce Email Verification
                if (!isTelegram && !user.emailVerified) {
                    await signOut(auth);
                    alert("Please verify your email address to access the dashboard.");
                    window.location.href = 'login.html';
                    return;
                }

                try {
                    // Check if profile exists (Registration Check)
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    let userData;
                    
                    if (!userDoc.exists()) {
                        // User authenticated but no profile -> Redirect to finish registration
                        
                        if (isTelegram) {
                            // Auto-create profile for Telegram users
                            const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
                            const firstName = tgUser?.first_name || "User";
                            const lastName = tgUser?.last_name || "";
                            const photoUrl = tgUser?.photo_url || "";
                            const username = tgUser?.username || "";
                            
                            const newUser = createUser(user.uid, null, firstName, lastName);
                            newUser.telegramId = tgUser?.id;
                            if (photoUrl) newUser.profile.photo = photoUrl;
                            if (username) newUser.profile.media = username;
                            
                            await setDoc(doc(db, "users", user.uid), newUser);
                            userData = newUser;
                        } else {
                            await signOut(auth);
                            window.location.href = 'login.html';
                            return;
                        }
                    } else {
                        userData = userDoc.data();
                        
                        // Update Telegram user data if changed
                        if (isTelegram) {
                            const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
                            if (tgUser) {
                                const firstName = tgUser.first_name || "";
                                const lastName = tgUser.last_name || "";
                                const photoUrl = tgUser.photo_url || "";
                                const username = tgUser.username || "";
                                const tgMediaLink = username || "";
                                
                                let needsUpdate = false;
                                const updates = {};

                                if (userData.firstName !== firstName) {
                                    updates.firstName = firstName;
                                    needsUpdate = true;
                                }
                                if (userData.lastName !== lastName) {
                                    updates.lastName = lastName;
                                    needsUpdate = true;
                                }
                                if (photoUrl && (!userData.profile || userData.profile.photo !== photoUrl)) {
                                    updates["profile.photo"] = photoUrl;
                                    needsUpdate = true;
                                }
                                if (tgMediaLink && (!userData.profile || userData.profile.media !== tgMediaLink)) {
                                    updates["profile.media"] = tgMediaLink;
                                    needsUpdate = true;
                                }

                                if (needsUpdate) {
                                    await updateDoc(doc(db, "users", user.uid), updates);
                                    // Update local userData to reflect changes immediately
                                    userData = { ...userData, ...updates };
                                    if (updates["profile.photo"] || updates["profile.media"]) {
                                        if (!userData.profile) userData.profile = {};
                                        if (updates["profile.photo"]) userData.profile.photo = photoUrl;
                                        if (updates["profile.media"]) userData.profile.media = tgMediaLink;
                                    }
                                }
                            }
                        }
                    }

                    // Profile exists -> Show Dashboard

                    // Telegram Users: Enforce Email Collection if missing

                    if(userNameElement) userNameElement.textContent = userData.firstName || user.email;
                    
                    // 1. Fetch Offered Rides
                    const offeredQuery = query(collection(db, "rides"), where("ownerId", "==", user.uid));
                    const offeredSnapshot = await getDocs(offeredQuery);
                    const offeredRides = offeredSnapshot.docs.map(doc => ({
                        type: 'offered',
                        id: doc.id,
                        ...doc.data(),
                        sortDate: (doc.data().times && doc.data().times[0]) ? new Date(doc.data().times[0]) : new Date(doc.data().date)
                    }));

                    // 2. Fetch Requests
                    const requestsQuery = query(collection(db, "requests"), where("userId", "==", user.uid));
                    const requestsSnapshot = await getDocs(requestsQuery);
                    const requests = [];
                    
                    for (const reqDoc of requestsSnapshot.docs) {
                        const request = reqDoc.data();
                        // Fetch associated ride
                        try {
                            const rideDoc = await getDoc(doc(db, "rides", request.rideId));
                            if (rideDoc.exists()) {
                                const ride = rideDoc.data();
                                ride.rideId = rideDoc.id; // Ensure ID is available
                                requests.push({
                                    type: 'requested',
                                    id: reqDoc.id,
                                    request: request,
                                    ride: ride,
                                    sortDate: (ride.times && ride.times[0]) ? new Date(ride.times[0]) : new Date(ride.date)
                                });
                            }
                        } catch (e) {
                            // Optional: showToast("Error loading some requests", 'error');
                        }
                    }

                    // 3. Combine, Filter & Sort
                    const allRides = [...offeredRides, ...requests];
                    const now = new Date();
                    
                    // Filter for future rides (or active ones)
                    const upcomingRides = allRides.filter(item => item.sortDate > now);
                    
                    upcomingRides.sort((a, b) => a.sortDate - b.sortDate);

                    const nextRide = upcomingRides[0];

                    if (!nextRide) {
                        ridesList.innerHTML = `
                            <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100 text-center">
                                <div class="bg-gray-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                                </div>
                                <h3 class="text-lg font-medium text-gray-900">${localization.getText('text_no_upcoming_rides')}</h3>
                                <p class="text-gray-500 mt-1 mb-4">${localization.getText('text_no_rides_scheduled')}</p>
                                <div class="flex justify-center gap-3">
                                    <a href="search-ride.html" class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-full shadow-sm text-gray-700 bg-white hover:bg-gray-50">
                                        ${localization.getText('btn_find_ride')}
                                    </a>
                                    <a href="add-ride.html" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-full shadow-sm text-white bg-[#25A8D9] hover:bg-[#1e90c7]">
                                        ${localization.getText('btn_offer_ride')}
                                    </a>
                                </div>
                            </div>
                        `;
                    } else {
                        ridesList.innerHTML = '';
                        
                        if (nextRide.type === 'offered') {
                            renderOfferedCard(nextRide);
                        } else {
                            renderRequestedCard(nextRide);
                        }
                    }

                } catch (error) {
                    showToast('error_load_rides', 'error');
                    ridesList.innerHTML = `<p class="text-red-500 text-center p-4">Error loading rides. Please try refreshing.</p>`;
                }
            } else {
                // User is signed out
                if (!window.isTelegramApp) {
                    window.location.href = 'login.html';
                }
            }
        });

        function renderOfferedCard(ride) {
            // Points & Times
            const fromPoint = ride.points[0] || { name: localization.getText('text_unknown') };
            const toPoint = ride.points[ride.points.length - 1] || { name: localization.getText('text_unknown') };
            const fromTime = (ride.times && ride.times[0]) ? formatDate(ride.times[0]) : "";
            const stops = ride.points.slice(1, -1).map(p => p.name).join(', ');

            // Segment Info
            const segment = ride.rideSegments[0] || {};
            const price = segment.packagePrice || 0;
            const currency = segment.currency || "";
            const maxPackages = segment.maxPackages || 0;
            const currentPackages = segment.packages ? segment.packages.length : 0;

            const maxS = segment.maxS || 0;
            const maxM = segment.maxM || 0;
            const maxL = segment.maxL || 0;
            
            const priceS = segment.priceS || 0;
            const priceM = segment.priceM || 0;
            const priceL = segment.priceL || 0;

            // Status Helper
            const getStatusInfo = (status) => {
                const map = {
                    'IDLE': { label: localization.getText('status_idle'), class: 'bg-blue-100 text-blue-800' },
                    'STARTED': { label: localization.getText('status_started'), class: 'bg-green-100 text-green-800' },
                    'ENDED': { label: localization.getText('status_ended'), class: 'bg-gray-100 text-gray-800' },
                    'RATED': { label: localization.getText('status_rated'), class: 'bg-yellow-100 text-yellow-800' }
                };
                return map[status] || { label: status || localization.getText('status_idle'), class: 'bg-gray-100 text-gray-800' };
            };
            const statusInfo = getStatusInfo(ride.status);

            // Package Info Grid
            let packagesHtml = '';
            if (maxS > 0 || maxM > 0 || maxL > 0 || true) { // Always show grid, even if max is 0 (since we removed capacity input)
                packagesHtml = '<div class="grid grid-cols-4 gap-2 border-t border-gray-100 pt-4 mt-2 items-center">';
                
                // Label
                packagesHtml += `
                    <div class="text-left pl-1 md:pl-4 text-[10px] md:text-xs font-bold text-gray-400 uppercase leading-tight">
                        ${localization.getText('label_capacity_price')}
                    </div>
                `;

                // S
                if (priceS > 0) {
                    packagesHtml += `
                        <div class="flex flex-col items-center border-r border-gray-100 last:border-0">
                            <div class="text-xs font-bold text-black mb-1">${localization.getText('option_small_simple')}</div>
                            <div class="text-sm text-[#25A8D9] font-bold">${priceS} ${currency}</div>
                        </div>
                    `;
                } else {
                        packagesHtml += `
                        <div class="flex flex-col items-center border-r border-gray-100 last:border-0 opacity-30">
                            <div class="text-xs font-bold text-black mb-1">${localization.getText('option_small_simple')}</div>
                            <div class="text-sm text-gray-400 font-bold">-</div>
                        </div>
                    `;
                }

                // M
                if (priceM > 0) {
                    packagesHtml += `
                        <div class="flex flex-col items-center border-r border-gray-100 last:border-0">
                            <div class="text-xs font-bold text-black mb-1">${localization.getText('option_medium_simple')}</div>
                            <div class="text-sm text-[#25A8D9] font-bold">${priceM} ${currency}</div>
                        </div>
                    `;
                } else {
                        packagesHtml += `
                        <div class="flex flex-col items-center border-r border-gray-100 last:border-0 opacity-30">
                            <div class="text-xs font-bold text-black mb-1">${localization.getText('option_medium_simple')}</div>
                            <div class="text-sm text-gray-400 font-bold">-</div>
                        </div>
                    `;
                }

                // L
                if (priceL > 0) {
                    packagesHtml += `
                        <div class="flex flex-col items-center last:border-0">
                            <div class="text-xs font-bold text-black mb-1">${localization.getText('option_large_simple')}</div>
                            <div class="text-sm text-[#25A8D9] font-bold">${priceL} ${currency}</div>
                        </div>
                    `;
                } else {
                        packagesHtml += `
                        <div class="flex flex-col items-center last:border-0 opacity-30">
                            <div class="text-xs font-bold text-black mb-1">${localization.getText('option_large_simple')}</div>
                            <div class="text-sm text-gray-400 font-bold">-</div>
                        </div>
                    `;
                }
                
                packagesHtml += '</div>';
            } else {
                // Fallback
                packagesHtml = `
                <div class="flex items-center justify-between border-t border-gray-100 pt-4 mt-2">
                    <div>
                        <p class="text-xs text-gray-400 mb-1 uppercase tracking-wide">${localization.getText('label_capacity')}</p>
                        <div class="flex items-center gap-2">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                            <span class="font-bold text-gray-700">${currentPackages}/${maxPackages} <span class="font-normal text-gray-500">${localization.getText('label_parcels_simple')}</span></span>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-gray-400 mb-1 uppercase tracking-wide">${localization.getText('label_price_per_parcel')}</p>
                        <p class="text-xl font-bold text-[#25A8D9]">${price} <span class="text-sm font-medium text-gray-500">${currency}</span></p>
                    </div>
                </div>
                `;
            }

            const rideEl = document.createElement('div');
            rideEl.className = 'bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow cursor-pointer';
            rideEl.onclick = () => window.location.href = `ride-details.html?id=${ride.id}`;
            
            rideEl.innerHTML = `
                <!-- Header: Status -->
                <div class="flex justify-between items-center mb-6">
                    <span class="px-3 py-1 rounded-full text-xs font-bold ${statusInfo.class}">
                        ${statusInfo.label}
                    </span>
                    <span class="text-xs font-bold text-[#25A8D9] bg-blue-50 px-2 py-1 rounded">${localization.getText('label_offered')}</span>
                </div>

                <!-- Route -->
                <div class="flex flex-col gap-0 mb-6 relative">
                    <div class="absolute left-[11px] top-3 bottom-3 w-0.5 bg-gray-100 -z-10"></div>

                    <!-- From -->
                    <div class="flex gap-4 pb-6">
                        <div class="flex flex-col items-center pt-1">
                            <div class="w-6 h-6 rounded-full bg-blue-50 flex items-center justify-center z-10 ring-4 ring-white">
                                <div class="w-2.5 h-2.5 rounded-full bg-[#25A8D9]"></div>
                            </div>
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-xs text-gray-500 mb-0.5 uppercase tracking-wide">${localization.getText('label_from')}</p>
                                    <p class="font-bold text-lg text-gray-900 leading-tight">${fromPoint.name}</p>
                                </div>
                                <p class="text-sm text-gray-500 font-medium text-right">${fromTime}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Stops -->
                    ${stops ? `
                    <div class="flex gap-4 pb-6">
                        <div class="flex flex-col items-center pt-1">
                            <div class="w-6 h-6 rounded-full bg-gray-50 flex items-center justify-center z-10 ring-4 ring-white">
                                <div class="w-1.5 h-1.5 rounded-full bg-gray-400"></div>
                            </div>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 mb-0.5 uppercase tracking-wide">${localization.getText('label_stops_simple')}</p>
                            <p class="text-sm text-gray-700 leading-relaxed">${stops}</p>
                        </div>
                    </div>
                    ` : ''}

                    <!-- To -->
                    <div class="flex gap-4">
                        <div class="flex flex-col items-center pt-1">
                            <div class="w-6 h-6 rounded-full bg-green-50 flex items-center justify-center z-10 ring-4 ring-white">
                                <div class="w-2.5 h-2.5 rounded-full bg-green-500"></div>
                            </div>
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-xs text-gray-500 mb-0.5 uppercase tracking-wide">${localization.getText('label_to')}</p>
                                    <p class="font-bold text-lg text-gray-900 leading-tight">${toPoint.name}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                ${packagesHtml}
            `;
            ridesList.appendChild(rideEl);
        }

        async function renderRequestedCard(data) {
            const { request, ride } = data;
            
            // Fetch Driver (needed for photo/name)
            let driver = { firstName: localization.getText('text_unknown'), lastName: localization.getText('text_unknown_driver') };
            try {
                const driverDoc = await getDoc(doc(db, "users", ride.ownerId));
                if (driverDoc.exists()) {
                    driver = driverDoc.data();
                }
            } catch (e) {
                // Silent fail for driver fetch
            }

            // Route Info
            const fromPoint = ride.points[0] || { name: localization.getText('text_unknown') };
            const toPoint = ride.points[ride.points.length - 1] || { name: localization.getText('text_unknown') };
            const fromTime = (ride.times && ride.times[0]) ? formatDate(ride.times[0]) : "";
            const stops = ride.points.slice(1, -1).map(p => p.name).join(', ');

            // Price Info
            const segment = ride.rideSegments[0] || {};
            const currency = segment.currency || "";
            
            let price = 0;
            if (request.packageType === 'S') price = segment.priceS || 0;
            else if (request.packageType === 'M') price = segment.priceM || 0;
            else if (request.packageType === 'L') price = segment.priceL || 0;
            else price = segment.packagePrice || 0;
            
            const driverName = `${driver.firstName || ''} ${driver.lastName || ''}`;
            const driverPhoto = (driver.profile && driver.profile.photo) ? driver.profile.photo : `https://ui-avatars.com/api/?name=${driverName}&background=random`;

            const statusColors = {
                'PENDING': 'bg-yellow-100 text-yellow-800',
                'ACCEPTED': 'bg-green-100 text-green-800',
                'REJECTED': 'bg-red-100 text-red-800',
                'CANCELLED': 'bg-gray-100 text-gray-800'
            };
            const statusClass = statusColors[request.status] || 'bg-gray-100 text-gray-800';

            const card = document.createElement('div');
            card.className = 'bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow cursor-pointer';
            card.onclick = () => window.location.href = `ride-details.html?id=${ride.rideId}`;

            card.innerHTML = `
                <!-- Header: Status -->
                <div class="flex justify-between items-center mb-6">
                    <span class="px-3 py-1 rounded-full text-xs font-bold ${statusClass}">
                        ${localization.getText('status_' + request.status.toLowerCase()) || request.status}
                    </span>
                    <span class="text-xs font-bold text-gray-500 bg-gray-100 px-2 py-1 rounded">${localization.getText('label_requested')}</span>
                </div>

                <!-- Route -->
                <div class="flex flex-col gap-0 mb-6 relative">
                    <div class="absolute left-[11px] top-3 bottom-3 w-0.5 bg-gray-100 -z-10"></div>

                    <!-- From -->
                    <div class="flex gap-4 pb-6">
                        <div class="flex flex-col items-center pt-1">
                            <div class="w-6 h-6 rounded-full bg-blue-50 flex items-center justify-center z-10 ring-4 ring-white">
                                <div class="w-2.5 h-2.5 rounded-full bg-[#25A8D9]"></div>
                            </div>
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-xs text-gray-500 mb-0.5 uppercase tracking-wide">${localization.getText('label_from')}</p>
                                    <p class="font-bold text-lg text-gray-900 leading-tight">${fromPoint.name}</p>
                                </div>
                                <p class="text-sm text-gray-500 font-medium text-right">${fromTime}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Stops -->
                    ${stops ? `
                    <div class="flex gap-4 pb-6">
                        <div class="flex flex-col items-center pt-1">
                            <div class="w-6 h-6 rounded-full bg-gray-50 flex items-center justify-center z-10 ring-4 ring-white">
                                <div class="w-1.5 h-1.5 rounded-full bg-gray-400"></div>
                            </div>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 mb-0.5 uppercase tracking-wide">${localization.getText('label_stops_simple')}</p>
                            <p class="text-sm text-gray-700 leading-relaxed">${stops}</p>
                        </div>
                    </div>
                    ` : ''}

                    <!-- To -->
                    <div class="flex gap-4">
                        <div class="flex flex-col items-center pt-1">
                            <div class="w-6 h-6 rounded-full bg-green-50 flex items-center justify-center z-10 ring-4 ring-white">
                                <div class="w-2.5 h-2.5 rounded-full bg-green-500"></div>
                            </div>
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-xs text-gray-500 mb-0.5 uppercase tracking-wide">${localization.getText('label_to')}</p>
                                    <p class="font-bold text-lg text-gray-900 leading-tight">${toPoint.name}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Footer: Requested Data -->
                <div class="flex items-center justify-between border-t border-gray-100 pt-4 mt-2">
                    <div>
                        <p class="text-xs text-gray-400 mb-1 uppercase tracking-wide">${localization.getText('label_requested')}</p>
                        <span class="font-bold text-gray-700">${request.packages} <span class="font-normal text-gray-500">${request.packageType === 'S' ? localization.getText('option_small_simple') : request.packageType === 'M' ? localization.getText('option_medium_simple') : request.packageType === 'L' ? localization.getText('option_large_simple') : localization.getText('label_parcels_simple')}</span></span>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-gray-400 mb-1 uppercase tracking-wide">${localization.getText('label_total')}</p>
                        <p class="text-xl font-bold text-[#25A8D9]">${request.packages} x ${price} <span class="text-sm font-medium text-gray-500">${currency}</span></p>
                    </div>
                </div>
            `;
            ridesList.appendChild(card);
        }

        // Logout Handlers
        const handleLogout = async (e) => {
            if (e) e.preventDefault();
            
            // Strict separation: Telegram users cannot logout manually via this button
            if (window.isTelegramApp) {
                return;
            }

            try {
                await signOut(auth);
                window.location.href = 'login.html';
            } catch (error) {
                showToast('error_sign_out', 'error');
            }
        };

        if(logoutBtnMobile) logoutBtnMobile.addEventListener('click', handleLogout);
        if(logoutBtnDesktop) logoutBtnDesktop.addEventListener('click', handleLogout);
    </script>
</body>
</html>
