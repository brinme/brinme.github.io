<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brinme App - Ride Details</title>
    <link rel="icon" href="../images/brinme_favicon.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="js/telegram-integration.js"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex h-screen overflow-hidden">
        <!-- Desktop Sidebar -->
        <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-200">
            <div class="p-6 flex items-center gap-2 border-b border-gray-100">
                <img src="../images/brinme_small_icon.webp" alt="Brinme" class="h-8 w-8 rounded-full">
                <span class="font-bold text-xl text-[#25A8D9]">brinme</span>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg font-medium transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    <span data-i18n="nav_home">Home</span>
                </a>
                <a href="rides.html" class="flex items-center gap-3 px-4 py-3 text-[#25A8D9] bg-blue-50 rounded-lg font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                    <span data-i18n="nav_rides">Rides</span>
                </a>
                <a href="profile.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg font-medium transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    <span data-i18n="nav_profile">Profile</span>
                </a>
            </nav>
            <div class="p-4 border-t border-gray-100">
                <button id="logoutBtnDesktop" class="flex items-center gap-3 px-4 py-3 text-red-500 hover:bg-red-50 rounded-lg font-medium w-full transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    <span data-i18n="nav_logout">Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col h-screen overflow-hidden">
            <!-- Mobile Header -->
            <header class="md:hidden bg-white shadow-sm p-4 flex items-center gap-4 sticky top-0 z-10">
                <a href="javascript:history.back()" class="text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </a>
                <h1 class="font-bold text-lg text-gray-800" data-i18n="ride_details_title">Ride Details</h1>
            </header>

            <main class="flex-1 overflow-y-auto p-4 pb-56 md:p-8 md:pb-32">
                <div class="max-w-2xl mx-auto space-y-6" id="rideContent">
                    <!-- Loading State -->
                    <div class="animate-pulse space-y-4">
                        <div class="h-32 bg-gray-200 rounded-xl"></div>
                        <div class="h-48 bg-gray-200 rounded-xl"></div>
                        <div class="h-24 bg-gray-200 rounded-xl"></div>
                    </div>
                </div>
            </main>

            <!-- Bottom Action Bar -->
            <div class="fixed bottom-0 left-0 right-0 md:left-64 bg-white border-t border-gray-200 p-4 shadow-lg z-20" id="actionBar">
                <!-- Dynamic Action Buttons -->
            </div>
        </div>
    </div>

    <!-- Rating Screen Removed -->

    <script type="module">
        import { auth, db } from './js/firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc, updateDoc, addDoc, deleteDoc, collection, query, where, getDocs, arrayUnion, arrayRemove, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { LocalizationManager } from './js/localization.js';
        import { showToast } from './js/toast.js';

        // Initialize localization
        const localization = new LocalizationManager();
        await localization.init();

        const rideContent = document.getElementById('rideContent');
        const actionBar = document.getElementById('actionBar');
        const logoutBtnDesktop = document.getElementById('logoutBtnDesktop');

        let currentRideData = null;
        let currentRequestData = null;
        let currentDriverData = null;

        // Helper: Format Date
        const formatDate = (dateString) => {
            if (!dateString) return localization.getText('text_unknown_date');
            const date = new Date(dateString);
            const day = date.getDate();
            const month = date.toLocaleString(localization.currentLang, { month: 'short' });
            const year = date.getFullYear();
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            
            return `${month} ${day}, ${year}. ${hours}:${minutes}`;
        };

        const formatDateOnly = (dateString) => {
            if (!dateString) return localization.getText('text_unknown_date');
            const date = new Date(dateString);
            const day = date.getDate();
            const month = date.toLocaleString(localization.currentLang, { month: 'short' });
            const year = date.getFullYear();
            return `${month} ${day}, ${year}`;
        };

        // Helper: Render Stars
        const getStarsHTML = (rating) => {
            let html = '<div class="flex text-yellow-400 text-xs">';
            for (let i = 1; i <= 5; i++) {
                if (rating >= i) {
                    html += `<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>`;
                } else {
                    html += `<svg class="w-4 h-4 text-gray-200" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>`;
                }
            }
            html += '</div>';
            return html;
        };

        let unsubscribeRide = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const urlParams = new URLSearchParams(window.location.search);
                const rideId = urlParams.get('id');

                if (!rideId) {
                    alert(localization.getText('alert_no_ride_id'));
                    window.location.href = 'rides.html';
                    return;
                }

                if (unsubscribeRide) unsubscribeRide();

                unsubscribeRide = onSnapshot(doc(db, "rides", rideId), async (rideDoc) => {
                    if (!rideDoc.exists()) {
                        alert(localization.getText('alert_ride_not_found'));
                        window.location.href = 'rides.html';
                        return;
                    }
                    const ride = rideDoc.data();
                    ride.rideId = rideDoc.id;

                    try {
                        // 2. Fetch Driver
                        const driverDoc = await getDoc(doc(db, "users", ride.ownerId));
                        const driver = driverDoc.exists() ? driverDoc.data() : { firstName: localization.getText('text_unknown'), lastName: localization.getText('text_unknown_driver') };

                        // 3. Fetch Current User's Request (if any)
                        let myRequest = null;
                        const q = query(collection(db, "requests"), where("rideId", "==", rideId), where("userId", "==", user.uid));
                        const requestSnapshot = await getDocs(q);
                        if (!requestSnapshot.empty) {
                            myRequest = requestSnapshot.docs[0].data();
                            myRequest.id = requestSnapshot.docs[0].id;
                        }

                        // 4. Fetch All Requests (if Owner and Ended)
                        let allRequests = [];
                        if (user.uid === ride.ownerId && ride.status === 'ENDED') {
                            try {
                                const qAll = query(collection(db, "requests"), where("rideId", "==", rideId));
                                const allSnap = await getDocs(qAll);
                                allSnap.forEach(d => {
                                    const data = d.data();
                                    data.id = d.id;
                                    allRequests.push(data);
                                });
                            } catch (e) {
                                console.error("Error fetching all requests:", e);
                            }
                        }

                        renderRideDetails(user, ride, driver, myRequest, allRequests);
                    } catch (error) {
                        console.error(error);
                        showToast('text_error_loading', 'error');
                    }
                }, (error) => {
                    console.error(error);
                    showToast('text_error_loading', 'error');
                });

            } else {
                if (window.isTelegramApp) {
                    window.location.href = 'index.html';
                } else {
                    window.location.href = 'login.html';
                }
            }
        });

        window.openChat = function(userId, telegramUsername) {
            const currentUserId = auth.currentUser ? auth.currentUser.uid : null;
            
            if (window.isTelegramApp && 
                currentUserId && currentUserId.startsWith('tg_') && 
                userId.startsWith('tg_') && 
                telegramUsername) {
                window.Telegram.WebApp.openTelegramLink('https://t.me/' + telegramUsername);
            } else {
                window.location.href = 'chat.html?userId=' + userId;
            }
        }

        function renderRideDetails(currentUser, ride, driver, myRequest, allRequests = []) {
            currentRideData = ride;
            currentDriverData = driver;
            currentRequestData = myRequest;

            const isOwner = currentUser.uid === ride.ownerId;
            
            // --- Driver Info ---
            const driverName = `${driver.firstName || ''} ${driver.lastName || ''}`;
            const driverPhoto = (driver.profile && driver.profile.photo) ? driver.profile.photo : `https://ui-avatars.com/api/?name=${driverName}&background=random`;
            const driverCountry = (driver.profile && driver.profile.country) ? driver.profile.country : '';
            const driverAbout = (driver.profile && driver.profile.about) ? driver.profile.about : '';
            
            // Calculate Rating
            let driverRating = 0;
            if (driver.scores && driver.scores.length > 0) {
                driverRating = (driver.scores.reduce((a, b) => a + b, 0) / driver.scores.length).toFixed(1);
            }

            // Calculate Age
            let driverAge = '';
            if (driver.profile && driver.profile.birthday) {
                const birthDate = new Date(driver.profile.birthday);
                const today = new Date();
                let age = today.getFullYear() - birthDate.getFullYear();
                const m = today.getMonth() - birthDate.getMonth();
                if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                    age--;
                }
                driverAge = age;
            }

            // Statistics
            const ridesCount = (driver.statistics && driver.statistics[0]) || 0;
            const packagesCount = (driver.statistics && driver.statistics[1]) || 0;

            // --- Route Info ---
            // Determine display points based on URL params (if available)
            const urlParams = new URLSearchParams(window.location.search);
            const fromQuery = urlParams.get('from');
            const toQuery = urlParams.get('to');
            const normalize = (str) => str ? str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : "";

            let displayFromIndex = 0;
            let displayToIndex = ride.points.length - 1;

            if (fromQuery) {
                const foundIndex = ride.points.findIndex(p => normalize(p.name).includes(normalize(fromQuery)));
                if (foundIndex !== -1) displayFromIndex = foundIndex;
            }
            
            if (toQuery) {
                const foundIndex = ride.points.findIndex(p => normalize(p.name).includes(normalize(toQuery)));
                if (foundIndex !== -1) displayToIndex = foundIndex;
            }

            const fromPoint = ride.points[displayFromIndex];
            const toPoint = ride.points[displayToIndex];
            
            let fromTime = "";
            if (displayFromIndex === 0 && ride.times && ride.times[0]) {
                fromTime = formatDate(ride.times[0]);
            } else {
                const dateSource = ride.date || (ride.times && ride.times[0]);
                if (dateSource) {
                    fromTime = formatDateOnly(dateSource);
                }
            }

            const toTime = formatDate(ride.times[displayToIndex]);
            const stops = ride.points.slice(displayFromIndex + 1, displayToIndex).map(p => p.name).join(', ');

            // --- Details ---
            const segment = ride.rideSegments[0] || {};
            const currency = segment.currency || "";
            
            // Calculate current usage per type
            let currentS = 0, currentM = 0, currentL = 0;
            if (segment.packages) {
                segment.packages.forEach(p => {
                    if (p.type === 'S') currentS++;
                    else if (p.type === 'M') currentM++;
                    else if (p.type === 'L') currentL++;
                    // Fallback for old data if any
                    else currentS++; 
                });
            }

            const maxS = segment.maxS || 0;
            const maxM = segment.maxM || 0;
            const maxL = segment.maxL || 0;
            
            const priceS = segment.priceS || 0;
            const priceM = segment.priceM || 0;
            const priceL = segment.priceL || 0;

            const packagesHtml = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-center text-sm mb-4">
                    <!-- Small -->
                    <div class="flex flex-col gap-2">
                        <div class="flex items-stretch bg-gray-50 rounded-xl border border-gray-100 h-14 overflow-hidden relative">
                            <div class="flex items-center gap-3 px-3 w-[60%]">
                                <div class="text-[#25A8D9] shrink-0">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                </div>
                                <span class="font-bold text-gray-900 text-sm truncate">${localization.getText('option_small_full')}</span>
                            </div>
                            <div class="absolute left-[60%] top-0 bottom-0 w-px bg-gray-200"></div>
                            <div class="flex items-center justify-center flex-1 px-2">
                                <span class="font-bold text-[#25A8D9] text-lg">${priceS > 0 ? priceS + ' ' + currency : '-'}</span>
                            </div>
                        </div>
                        <div class="text-xs text-gray-500 text-left px-1">
                            ${localization.getText('desc_small')}
                        </div>
                    </div>

                    <!-- Medium -->
                    <div class="flex flex-col gap-2">
                        <div class="flex items-stretch bg-gray-50 rounded-xl border border-gray-100 h-14 overflow-hidden relative">
                            <div class="flex items-center gap-3 px-3 w-[60%]">
                                <div class="text-[#25A8D9] shrink-0">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                                </div>
                                <span class="font-bold text-gray-900 text-sm truncate">${localization.getText('option_medium_full')}</span>
                            </div>
                            <div class="absolute left-[60%] top-0 bottom-0 w-px bg-gray-200"></div>
                            <div class="flex items-center justify-center flex-1 px-2">
                                <span class="font-bold text-[#25A8D9] text-lg">${priceM > 0 ? priceM + ' ' + currency : '-'}</span>
                            </div>
                        </div>
                        <div class="text-xs text-gray-500 text-left px-1">
                            ${localization.getText('desc_medium')}
                        </div>
                    </div>

                    <!-- Large -->
                    <div class="flex flex-col gap-2">
                        <div class="flex items-stretch bg-gray-50 rounded-xl border border-gray-100 h-14 overflow-hidden relative">
                            <div class="flex items-center gap-3 px-3 w-[60%]">
                                <div class="text-[#25A8D9] shrink-0">
                                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M18.184,11.019c-.043-.253-1.237-7.419-1.2-7.184A1,1,0,0,0,16,3H12a1,1,0,0,0,0,2h3.153l.586,3.517L9.566,12.505a5.106,5.106,0,1,0,1.081,1.682l5.45-3.521.113.679a5,5,0,1,0,1.974-.326ZM6,19a3,3,0,0,1,0-6,2.967,2.967,0,0,1,1.821.633L5.458,15.16a1,1,0,1,0,1.084,1.68l2.37-1.531A2.972,2.972,0,0,1,9,16,3,3,0,0,1,6,19Zm12,0a2.99,2.99,0,0,1-1.449-5.611l.463,2.776a1,1,0,1,0,1.972-.33l-.463-2.782A3,3,0,0,1,18,19ZM8.707,6.293l2,2A1,1,0,1,1,9.293,9.707L7.586,8H6A1,1,0,0,1,6,6H8A1,1,0,0,1,8.707,6.293Z"></path></svg>
                                </div>
                                <span class="font-bold text-gray-900 text-sm truncate">${localization.getText('option_large_full')}</span>
                            </div>
                            <div class="absolute left-[60%] top-0 bottom-0 w-px bg-gray-200"></div>
                            <div class="flex items-center justify-center flex-1 px-2">
                                <span class="font-bold text-[#25A8D9] text-lg">${priceL > 0 ? priceL + ' ' + currency : '-'}</span>
                            </div>
                        </div>
                        <div class="text-xs text-gray-500 text-left px-1">
                            ${localization.getText('desc_large')}
                        </div>
                    </div>
                </div>
            `;

            // --- Render Content ---
            rideContent.innerHTML = `
                <!-- Driver Card -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <div class="flex flex-col md:flex-row md:items-start gap-4 md:gap-6">
                        <div class="flex gap-4 flex-1">
                            <!-- Picture -->
                            <div class="relative flex-shrink-0">
                                <img src="${driverPhoto}" alt="${driverName}" class="w-16 h-16 md:w-24 md:h-24 rounded-full object-cover border-4 border-white shadow-md">
                            </div>
                            
                            <!-- Name & Info -->
                            <div class="flex-1 min-w-0 overflow-hidden">
                                <h2 id="driver-name" class="text-lg md:text-2xl font-bold text-gray-900 whitespace-nowrap inline-block">${driverName}</h2>
                                <p class="text-gray-500 text-sm mb-1 truncate">${driver.email || ''}</p>
                                
                                ${!isOwner ? `
                                    <div class="space-y-1">
                                        <!-- Rating -->
                                        <div class="flex items-center gap-1">
                                            ${getStarsHTML(driverRating)}
                                            <a href="reviews.html?userId=${ride.ownerId}" class="text-xs text-[#25A8D9] hover:underline ml-2 focus:outline-none">
                                                (${driver.scores ? driver.scores.length : 0} ${localization.getText('text_reviews_parens')})
                                            </a>
                                        </div>

                                        <div class="flex gap-4 my-2 text-sm text-gray-600">
                                            <div><span class="font-bold text-gray-900">${ridesCount}</span> ${localization.getText('stat_rides')}</div>
                                            <div><span class="font-bold text-gray-900">${packagesCount}</span> ${localization.getText('stat_packages')}</div>
                                        </div>

                                        ${driverCountry ? `<p class="text-sm text-gray-600"><span class="font-medium">${localization.getText('label_country')}:</span> ${driverCountry}</p>` : ''}
                                        ${driverAge ? `<p class="text-sm text-gray-600"><span class="font-medium">${localization.getText('label_age')}:</span> ${driverAge} ${localization.getText('text_years')}</p>` : ''}
                                        ${driverAbout ? `<p class="text-sm text-gray-600"><span class="font-medium">${localization.getText('label_about')}:</span> ${driverAbout}</p>` : ''}
                                    </div>
                                ` : ''}
                            </div>
                        </div>

                        ${!isOwner ? `
                        <div class="md:ml-auto pt-2 md:pt-0">
                            <button onclick="openChat('${ride.ownerId}', '${(driver.profile && driver.profile.media) ? driver.profile.media : ''}')" class="w-full md:w-auto px-6 py-2 text-[#25A8D9] border border-[#25A8D9] hover:bg-blue-50 rounded-xl transition-colors flex items-center justify-center gap-2 font-bold">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                                <span>${localization.getText('btn_chat')}</span>
                            </button>
                        </div>
                        ` : ''}
                    </div>
                </div>

                <!-- Itinerary Card -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-gray-900 mb-6">${localization.getText('title_itinerary')}</h3>
                    <div class="flex flex-col gap-0 relative">
                        <div class="absolute left-[7px] md:left-[11px] top-3 bottom-3 w-0.5 bg-gray-100 -z-10"></div>
                        
                        <!-- From -->
                        <div class="flex gap-4 pb-8">
                            <div class="flex flex-col items-center pt-1">
                                <div class="w-4 h-4 md:w-6 md:h-6 rounded-full bg-blue-50 flex items-center justify-center z-10 ring-4 ring-white">
                                    <div class="w-1.5 h-1.5 md:w-2.5 md:h-2.5 rounded-full bg-[#25A8D9]"></div>
                                </div>
                            </div>
                            <div class="flex-1">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <p class="text-xs text-gray-500 mb-0.5 uppercase tracking-wide">${localization.getText('label_from_simple')}</p>
                                        <p class="font-bold text-lg text-gray-900 leading-tight">${fromPoint.name}</p>
                                    </div>
                                    <p class="text-sm text-gray-500 font-medium text-right">${fromTime}</p>
                                </div>
                            </div>
                        </div>

                        <!-- Stops -->
                        ${stops ? `
                        <div class="flex gap-4 pb-8">
                            <div class="flex flex-col items-center pt-1">
                                <div class="w-4 h-4 md:w-6 md:h-6 rounded-full bg-gray-50 flex items-center justify-center z-10 ring-4 ring-white">
                                    <div class="w-1 h-1 md:w-1.5 md:h-1.5 rounded-full bg-gray-400"></div>
                                </div>
                            </div>
                            <div>
                                <p class="text-xs text-gray-500 mb-0.5 uppercase tracking-wide">${localization.getText('label_stops_simple')}</p>
                                <p class="text-sm text-gray-700 leading-relaxed">${stops}</p>
                            </div>
                        </div>
                        ` : ''}

                        <!-- To -->
                        <div class="flex gap-4">
                            <div class="flex flex-col items-center pt-1">
                                <div class="w-4 h-4 md:w-6 md:h-6 rounded-full bg-green-50 flex items-center justify-center z-10 ring-4 ring-white">
                                    <div class="w-1.5 h-1.5 md:w-2.5 md:h-2.5 rounded-full bg-green-500"></div>
                                </div>
                            </div>
                            <div class="flex-1">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <p class="text-xs text-gray-500 mb-0.5 uppercase tracking-wide">${localization.getText('label_to_simple')}</p>
                                        <p class="font-bold text-lg text-gray-900 leading-tight">${toPoint.name}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Capacity & Price Card -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-gray-900 mb-6">${localization.getText('title_capacity_price')}</h3>
                    ${packagesHtml}
                    ${isOwner ? `
                    <div class="pt-4 mt-4 border-t border-gray-100">
                        <button onclick="window.location.href='requests.html?rideId=${ride.rideId}'" class="w-full py-3 bg-white border border-[#25A8D9] text-[#25A8D9] font-bold rounded-xl hover:bg-blue-50 transition-colors flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                            ${localization.getText('btn_view_requests')} (${ride.requests ? ride.requests.length : 0})
                        </button>
                    </div>
                    ` : ''}
                </div>

                <!-- Additional Info Card -->
                ${(ride.plate || ride.comment) ? `
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-4">
                    <h3 class="font-bold text-gray-900 mb-4">${localization.getText('title_additional_info')}</h3>
                    ${ride.plate ? `
                    <div class="flex justify-between items-center border-b border-gray-100 pb-4">
                        <span class="text-gray-600">${localization.getText('label_car_plate_simple')}</span>
                        <span class="font-mono bg-gray-100 px-2 py-1 rounded text-gray-800 font-bold">${ride.plate}</span>
                    </div>
                    ` : ''}
                    ${ride.comment ? `
                    <div class="pt-2">
                        <p class="text-xs text-gray-500 uppercase mb-2">${localization.getText('label_comment_simple')}</p>
                        <p class="text-gray-700 text-sm leading-relaxed bg-gray-50 p-3 rounded-lg">${ride.comment}</p>
                    </div>
                    ` : ''}
                </div>
                ` : ''}
            `;

            // --- Render Action Bar ---
            renderActionBar(isOwner, ride, myRequest, currentUser, allRequests);

            // --- Auto Scroll Name ---
            setTimeout(() => {
                const nameEl = document.getElementById('driver-name');
                if (nameEl && nameEl.scrollWidth > nameEl.parentElement.clientWidth) {
                    const distance = nameEl.scrollWidth - nameEl.parentElement.clientWidth;
                    const duration = distance * 40 + 2000; // Speed + base time
                    
                    nameEl.animate([
                        { transform: 'translateX(0)' },
                        { transform: `translateX(-${distance}px)` }
                    ], {
                        duration: duration,
                        iterations: Infinity,
                        direction: 'alternate',
                        easing: 'ease-in-out',
                        delay: 1000
                    });
                }
            }, 100);
        }

        function renderActionBar(isOwner, ride, myRequest, currentUser, allRequests = []) {
            actionBar.innerHTML = '';
            const container = document.createElement('div');
            container.className = 'max-w-2xl mx-auto flex flex-col gap-3';

            if (isOwner) {
                // --- Owner Actions ---
                
                // Status Actions
                if (ride.status === 'IDLE' || ride.status === 'STARTED') {
                    const startTime = new Date(ride.times[0]);
                    const now = new Date();

                    // Show End Ride Button (Simplified Flow) - Only if time >= start time
                    if (now >= startTime) {
                        const endBtn = document.createElement('button');
                        endBtn.className = 'w-full py-3 bg-[#25A8D9] text-white font-bold rounded-xl hover:bg-[#1e90c7] transition-colors';
                        endBtn.textContent = localization.getText('btn_end_ride');
                        endBtn.onclick = () => updateRideStatus(ride.rideId, 'ENDED');
                        container.appendChild(endBtn);
                    }

                    // Show Cancel Button (Secondary) - Only if not started yet (time-wise)
                    if (now < startTime) {
                        const cancelBtn = document.createElement('button');
                        cancelBtn.className = 'w-full py-3 bg-red-50 text-red-500 font-bold rounded-xl hover:bg-red-100 transition-colors';
                        cancelBtn.textContent = localization.getText('btn_cancel_ride');
                        cancelBtn.onclick = () => deleteRide(ride.rideId);
                        container.appendChild(cancelBtn);
                    }

                } else if (ride.status === 'ENDED') {
                    const rateBtn = document.createElement('button');
                    rateBtn.className = 'w-full py-3 bg-yellow-400 text-white font-bold rounded-xl hover:bg-yellow-500 transition-colors';
                    
                    // Check if all accepted requests are rated
                    const acceptedRequests = allRequests.filter(r => r.status === 'ACCEPTED' || r.status === 'DELIVERED');
                    const allRated = acceptedRequests.length > 0 && acceptedRequests.every(r => r.driverRated);
                    
                    if (allRated) {
                        rateBtn.textContent = localization.getText('btn_senders_rated');
                        rateBtn.disabled = true;
                        rateBtn.className = 'w-full py-3 bg-gray-300 text-white font-bold rounded-xl cursor-not-allowed';
                    } else {
                        rateBtn.textContent = localization.getText('btn_rate_senders');
                        rateBtn.onclick = () => window.location.href = `rate.html?rideId=${ride.rideId}&mode=senders`;
                    }
                    
                    container.appendChild(rateBtn);
                }

            } else {
                // --- Requester Actions ---
                
                if (myRequest) {
                    // Request Exists
                    const statusDiv = document.createElement('div');
                    statusDiv.className = 'flex justify-between items-center';
                    
                    const label = document.createElement('span');
                    label.className = 'text-gray-600 font-medium';
                    
                    const typeNames = { 
                        'S': localization.getText('option_small_simple'), 
                        'M': localization.getText('option_medium_simple'), 
                        'L': localization.getText('option_large_simple') 
                    };
                    const typeName = typeNames[myRequest.packageType] || myRequest.packageType || 'Package';
                    const count = myRequest.packages || 1;
                    label.textContent = `${count} x ${typeName}`;
                    
                    const statusBadge = document.createElement('span');
                    let statusColorClass = 'bg-gray-100 text-gray-600';
                    if (myRequest.status === 'PENDING') statusColorClass = 'bg-orange-100 text-orange-600';
                    else if (myRequest.status === 'ACCEPTED') statusColorClass = 'bg-green-100 text-green-600';
                    else if (myRequest.status === 'REJECTED') statusColorClass = 'bg-red-100 text-red-600';
                    else if (myRequest.status === 'DELIVERED') statusColorClass = 'bg-blue-100 text-blue-600';

                    statusBadge.className = `px-4 py-2 rounded-full text-sm font-bold ${statusColorClass}`;
                    const statusKey = 'status_' + myRequest.status.toLowerCase();
                    statusBadge.textContent = localization.getText(statusKey) || myRequest.status;

                    statusDiv.appendChild(label);
                    statusDiv.appendChild(statusBadge);
                    container.appendChild(statusDiv);

                    if ((myRequest.status === 'PENDING' || myRequest.status === 'ACCEPTED') && ride.status === 'IDLE') {
                        const cancelReqBtn = document.createElement('button');
                        cancelReqBtn.className = 'w-full py-3 bg-red-50 text-red-500 font-bold rounded-xl hover:bg-red-100 transition-colors';
                        cancelReqBtn.textContent = localization.getText('btn_cancel_request');
                        cancelReqBtn.onclick = () => cancelRequest(ride, myRequest);
                        container.appendChild(cancelReqBtn);
                    }
                    
                    // Received Package Action
                    if (myRequest.status === 'ACCEPTED') {
                        const receivedBtn = document.createElement('button');
                        receivedBtn.className = 'w-full py-3 bg-[#25A8D9] text-white font-bold rounded-xl hover:bg-[#1e90c7] transition-colors mt-2';
                        receivedBtn.textContent = localization.getText('btn_received_package');
                        receivedBtn.onclick = () => updateRequestStatus(myRequest.id, 'DELIVERED');
                        container.appendChild(receivedBtn);
                    }

                    // Rate Driver Action (After Delivered)
                    if (myRequest.status === 'DELIVERED') {
                         const rateDriverBtn = document.createElement('button');
                        rateDriverBtn.className = 'w-full py-3 bg-yellow-400 text-white font-bold rounded-xl hover:bg-yellow-500 transition-colors mt-2';
                        rateDriverBtn.textContent = localization.getText('btn_rate_driver');
                        if (myRequest.senderRated) {
                            rateDriverBtn.textContent = localization.getText('btn_driver_rated');
                            rateDriverBtn.disabled = true;
                            rateDriverBtn.className = 'w-full py-3 bg-gray-300 text-white font-bold rounded-xl cursor-not-allowed';
                        } else {
                            rateDriverBtn.onclick = () => window.location.href = `rate.html?rideId=${ride.rideId}&mode=driver&requestId=${myRequest.id}`;
                        }
                        container.appendChild(rateDriverBtn);
                    }

                } else {
                    // No Request - Create One
                    if (ride.status === 'IDLE' || ride.status === 'STARTED') {
                        const inputGroup = document.createElement('div');
                        inputGroup.className = 'flex flex-col gap-4';
                        
                        let selectedType = 'S';

                        const typeContainer = document.createElement('div');
                        typeContainer.innerHTML = `
                            <label class="block text-xs text-gray-500 mb-2">${localization.getText('label_type')}</label>
                            <div class="grid grid-cols-3 gap-2">
                                <button type="button" data-type="S" class="package-select-btn px-1 py-3 border-2 border-[#25A8D9] bg-blue-50 text-[#25A8D9] rounded-xl text-xs md:text-sm font-bold transition-all">
                                    ${localization.getText('option_small_full')}
                                </button>
                                <button type="button" data-type="M" class="package-select-btn px-1 py-3 border border-gray-200 text-gray-600 rounded-xl text-xs md:text-sm font-medium hover:bg-gray-50 transition-all">
                                    ${localization.getText('option_medium_full')}
                                </button>
                                <button type="button" data-type="L" class="package-select-btn px-1 py-3 border border-gray-200 text-gray-600 rounded-xl text-xs md:text-sm font-medium hover:bg-gray-50 transition-all">
                                    ${localization.getText('option_large_full')}
                                </button>
                            </div>
                        `;
                        inputGroup.appendChild(typeContainer);

                        const buttons = typeContainer.querySelectorAll('.package-select-btn');
                        buttons.forEach(btn => {
                            btn.onclick = () => {
                                buttons.forEach(b => {
                                    b.className = 'package-select-btn px-1 py-3 border border-gray-200 text-gray-600 rounded-xl text-xs md:text-sm font-medium hover:bg-gray-50 transition-all';
                                });
                                btn.className = 'package-select-btn px-1 py-3 border-2 border-[#25A8D9] bg-blue-50 text-[#25A8D9] rounded-xl text-xs md:text-sm font-bold transition-all';
                                selectedType = btn.getAttribute('data-type');
                            };
                        });
                        
                        const requestBtn = document.createElement('button');
                        requestBtn.className = 'w-full py-3 bg-[#25A8D9] text-white font-bold rounded-xl hover:bg-[#1e90c7] transition-colors';
                        requestBtn.textContent = localization.getText('btn_request_delivery');
                        requestBtn.onclick = async () => {
                            // Validate Price
                            const segment = ride.rideSegments[0] || {};
                            const priceKey = 'price' + selectedType;
                            const price = segment[priceKey] || 0;

                            if (price <= 0) {
                                alert(localization.getText('error_cannot_request_size'));
                                return;
                            }

                            await createRequest(ride, currentUser, 1, selectedType); 
                        };

                        inputGroup.appendChild(requestBtn);
                        container.appendChild(inputGroup);
                    } else {
                        const msg = document.createElement('div');
                        msg.className = 'text-center text-gray-500 font-medium';
                        msg.textContent = localization.getText('text_ride_closed');
                        container.appendChild(msg);
                    }
                }
            }

            actionBar.appendChild(container);
        }

        async function updateRequestStatus(requestId, status) {
            try {
                await updateDoc(doc(db, "requests", requestId), { status: status });
                window.location.reload();
            } catch (e) {
                showToast('alert_status_update_error', 'error');
            }
        }

        async function deleteRide(rideId) {
            if(!confirm(localization.getText('confirm_delete_ride'))) return;

            try {
                // 1. Reject all pending/accepted requests
                const qRequests = query(collection(db, "requests"), where("rideId", "==", rideId));
                const requestsSnapshot = await getDocs(qRequests);
                
                const updatePromises = requestsSnapshot.docs.map(doc => 
                    updateDoc(doc.ref, { status: 'REJECTED' })
                );
                await Promise.all(updatePromises);

                // 2. Delete the ride document
                await deleteDoc(doc(db, "rides", rideId));

                alert(localization.getText('alert_ride_deleted'));
                window.location.href = 'rides.html';

            } catch (error) {
                showToast('alert_delete_error', 'error');
            }
        }

        async function cancelRequest(ride, request) {
            if (!confirm(localization.getText('confirm_cancel_request'))) return;

            try {
                const rideRef = doc(db, "rides", ride.rideId);
                const requestRef = doc(db, "requests", request.id);

                // 1. Delete Request Document
                await deleteDoc(requestRef);

                // 2. Remove from Ride's requests array
                await updateDoc(rideRef, {
                    requests: arrayRemove(request.id)
                });

                // 3. If Accepted, remove from packages
                if (request.status === 'ACCEPTED') {
                    const rideDoc = await getDoc(rideRef);
                    const rideData = rideDoc.data();
                    
                    if (rideData.rideSegments && rideData.rideSegments.length > 0) {
                        const segment = rideData.rideSegments[0];
                        if (segment.packages) {
                            const originalLength = segment.packages.length;
                            segment.packages = segment.packages.filter(p => p.requestId !== request.id);
                            
                            if (segment.packages.length !== originalLength) {
                                await updateDoc(rideRef, { rideSegments: rideData.rideSegments });
                            }
                        }
                    }
                }

                alert(localization.getText('alert_request_cancelled'));
                window.location.reload();

            } catch (error) {
                showToast('alert_cancel_error', 'error');
            }
        }

        async function updateRideStatus(rideId, status) {
            try {
                await updateDoc(doc(db, "rides", rideId), { status: status });
                window.location.reload();
            } catch (e) {
                showToast('alert_status_update_error', 'error');
            }
        }

        async function createRequest(ride, user, packages, packageType) {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const fromCity = urlParams.get('from');
                const toCity = urlParams.get('to');

                // Create Request Document
                const requestData = {
                    rideId: ride.rideId,
                    userId: user.uid,
                    packages: packages,
                    packageType: packageType,
                    status: 'PENDING',
                    createdAt: new Date().toISOString()
                };

                if (fromCity) requestData.fromLocation = fromCity;
                if (toCity) requestData.toLocation = toCity;
                
                const docRef = await addDoc(collection(db, "requests"), requestData);
                
                // Update Ride's requests array
                await updateDoc(doc(db, "rides", ride.rideId), {
                    requests: arrayUnion(docRef.id)
                });
                
                alert(localization.getText('alert_request_sent'));
                window.location.reload();

            } catch (e) {
                showToast('alert_request_error', 'error');
            }
        }

        if(logoutBtnDesktop) logoutBtnDesktop.addEventListener('click', async () => {
            try {
                await signOut(auth);
                window.location.href = 'login.html';
            } catch (error) {
                showToast('error_sign_out', 'error');
            }
        });
    </script>
</body>
</html>
